; OPcache tuning for a small (1 vCPU / 2 GB) box running a single WP site.
; validate_timestamps=1 with revalidate_freq=2 makes php-fpm re-check a file's
; mtime at most every 2 seconds. WordPress core, plugins and themes change in
; place (auto-updates run via wp-cli from cron, in the CLI SAPI, which can't
; reset php-fpm's opcache), so stale bytecode must not be able to outlive an
; update. With validate_timestamps=0 it would, until the container restarted.
opcache.enable=1
opcache.memory_consumption=96
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.save_comments=1
opcache.revalidate_freq=2
